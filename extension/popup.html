<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>纪要存档</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>纪要存档</h1>
<details id="acct-box"><summary id="acct-summary">mooodle 账号</summary><input id="acct" placeholder="教师账号" autocomplete="username"><input id="pwd" type="password" placeholder="密码" autocomplete="current-password"><div class="row"><button id="acct-save" class="primary">保存并登录</button><button id="acct-clear">清除账号</button></div></details>
<p>先在腾讯会议「纪要」点击复制，再读取并核对全文。</p>
<label for="title">腾讯会议课堂名称</label><div class="row"><input id="title" placeholder="读取标题或填写关键名字"><button id="title-read">读取标题</button></div>
<label for="date">课节日期（北京时间）</label><input id="date" type="date">
<div class="row"><button id="load" class="primary">匹配当日课次</button></div>
<label for="session">课表中的课次</label><select id="session"><option value="">请先匹配当日课次</option></select>
<button id="read" class="primary">读取已复制纪要</button>
<textarea id="notes" aria-label="纪要预览" placeholder="也可以在这里粘贴纪要"></textarea>
<details id="rating-box"><summary>课堂评分（选填）</summary><div class="sec">学生表现</div><div class="rate"><span>专注力</span><select id="r-focus"><option value="">不填</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div class="rate"><span>互动性</span><select id="r-interaction"><option value="">不填</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div class="rate"><span>课堂纪律</span><select id="r-discipline"><option value="">不填</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div class="rate"><span>做题准确率</span><select id="r-accuracy"><option value="">不填</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div class="rate"><span>整体表现评估</span><select id="r-overall"><option value="">不填</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div class="sec">授课进度 <button id="add-item" type="button">添加知识点</button></div><div id="items"></div><div class="rate"><span>整体吸收程度 %</span><input id="r-progress" type="number" min="0" max="100" placeholder="不填"></div><p class="hint">不填的项目保持原评分不变；该课节还没有评分时按网站默认值新建。</p></details>
<div class="row"><button id="save" class="primary" disabled>存入选定课堂总结</button><button id="stage">仅准备纪要</button><button id="clear">清除纪要</button></div>
<p id="status" role="status"></p><p>账号密码只保存在本机浏览器插件中。存档前会弹出确认，纪要追加到原总结后，不覆盖。没有评分的课节会自动新建评分，学生表现和授课进度可不填。同日多课暂须手动保存。插件不调用 AI。</p>
<script src="matching.js"></script><script src="popup.js"></script></body></html>
